# Architecture section 14.
#
# Postgres + Redis are NOT in this file anymore. DATABASE_URL in .env points
# at a hosted Postgres (e.g. Supabase). Redis isn't needed until the arq
# worker split lands.

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: .env
    environment:
      STORAGE_DIR: /data/storage
    volumes:
      - storage:/data/storage
    ports:
      - "8000:8000"

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    depends_on:
      - backend
    ports:
      - "5173:80"

  # Heavier image: Playwright + Chromium for JS-shell fallback. Not started
  # by default (backend currently runs the pipeline via BackgroundTasks).
  # Build with `docker compose --profile worker build` once an arq entry
  # point is wired.
  worker:
    build:
      context: .
      dockerfile: worker/Dockerfile
    env_file: .env
    environment:
      STORAGE_DIR: /data/storage
    volumes:
      - storage:/data/storage
    profiles: ["worker"]

volumes:
  storage:
