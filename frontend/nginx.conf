server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    # CV uploads are PDFs; nginx's 1 MB default would reject most of them (413).
    client_max_body_size 10m;

    # Vite emits content-hashed assets: safe to cache for a year.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Same role as the Vite dev proxy (vite.config.ts), which only exists in
    # `npm run dev`. In Kubernetes the Ingress routes /api before it gets here.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Drafting / deep-dive routes wait on an LLM; don't cut them at 60 s.
        proxy_read_timeout 180s;
    }

    # index.html must never be cached, or users keep loading old asset hashes.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # React Router: unknown paths serve the SPA so deep links work on reload.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
