# Local Kubernetes cluster: `make kind-up`.
# Single node, labelled so ingress-nginx's kind manifest schedules onto it.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: phd
nodes:
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
    extraPortMappings:
      # http://localhost:8088 → ingress controller :80.
      # Not host port 80: XAMPP / IIS commonly hold it on Windows.
      - containerPort: 80
        hostPort: 8088
        protocol: TCP
