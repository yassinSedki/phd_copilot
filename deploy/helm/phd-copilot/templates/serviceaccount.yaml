{{- if .Values.workloadIdentity.clientId }}
{{- /*
Azure Workload Identity: pods using this ServiceAccount get short-lived
tokens for the managed identity (federated in infra/terraform). The app's
DefaultAzureCredential picks them up — no storage keys anywhere.
*/ -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.workloadIdentity.serviceAccountName }}
  labels:
    {{- include "phd.labels" . | nindent 4 }}
  annotations:
    azure.workload.identity/client-id: {{ .Values.workloadIdentity.clientId | quote }}
{{- end }}
