{{- if .Values.storage.persistent }}
{{- /*
Local file storage (CVs, raw scrape snapshots). ReadWriteOnce: fine on a
single-node kind cluster; on a multi-node cluster pods on other nodes cannot
mount it — that is why prod disables this and uses the blob bucket
(FILE_STORE__BACKEND=azure).
*/ -}}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: phd-storage
  labels:
    {{- include "phd.labels" . | nindent 4 }}
  annotations:
    # `helm uninstall` must never delete user files.
    "helm.sh/resource-policy": keep
spec:
  accessModes: [ReadWriteOnce]
  {{- with .Values.storage.storageClassName }}
  storageClassName: {{ . }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.storage.size }}
{{- end }}
