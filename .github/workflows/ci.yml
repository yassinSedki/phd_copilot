# Verification on every pull request (and on main, so main is always known-good).
# Required status checks for branch protection: lint-test, frontend, build-images.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  # A new push to the same PR cancels the now-outdated run.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Tests must never reach a paid LLM API.
      LLM__PROVIDER: stub
      EMBEDDING__PROVIDER: stub
      STORAGE_DIR: /tmp/storage
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      # Same requirements file the Docker image installs: CI tests what ships.
      # Tool versions pinned so a new ruff release can't turn main red overnight.
      - name: Install dependencies
        run: pip install -r backend/requirements.txt pytest==8.3.4 pytest-asyncio==0.23.8 ruff==0.15.7

      - name: Lint
        run: ruff check . --output-format=github

      - name: Unit tests
        run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - name: Type-check and build
        run: npm run build

  build-images:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: false
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: frontend
          push: false
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  helm-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v3.16.3 # pinned: Helm 4 renames --atomic
      - name: Lint and render every values file
        run: |
          helm lint deploy/helm/phd-copilot
          for f in deploy/helm/phd-copilot/values-*.yaml; do
            echo "::group::$f"
            helm template phd deploy/helm/phd-copilot -f "$f" > /dev/null
            echo "::endgroup::"
          done
